<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: weather page of a regional paper on election eve
   IDEA: the TV weather map of the province, municipality by municipality
   PICTURE: choropleth of the 102 municipalities with the big towns labelled
   COLOUR and TYPE: cool blues to pale sand for a mild November day, La Tribuna red only for controls, greys for sky; Archivo + Archivo Narrow
   LAYOUT: title, three-way toggle, map beside a detail card, search, legend, source */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#141414);--ink:light-dark(#1b1b1b,#f1f1f1);--soft:light-dark(#686868,#a9a9a9);
--line:light-dark(#e4e4e4,#2e2e2e);--red:#c8102e;--panel:light-dark(#f5f5f4,#1f1f1f);--edge:light-dark(#ffffff,#141414)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:960px;margin:0 auto;padding:clamp(18px,3vw,32px) max(4vw,14px)}
h1{font-size:clamp(24px,4.2vw,38px);line-height:1.08;margin:0 0 6px;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--soft);margin:0 0 16px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ctrl button{font:600 15px Archivo,sans-serif;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.ctrl button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
svg{width:100%;height:auto;display:block}
.m{stroke:var(--edge);stroke-width:.7;cursor:pointer;transition:fill .5s}
.m:hover,.m.on{stroke:var(--ink);stroke-width:2}
.prov{fill:none;stroke:var(--ink);stroke-width:1.2;pointer-events:none}
.lbl{font:700 15px "Archivo Narrow",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--edge);stroke-width:3.5px;pointer-events:none}
.lbl .n{font-weight:500}
.card{background:var(--panel);border-radius:14px;padding:16px 18px}
.card h2{margin:0;font-size:24px;line-height:1.1;font-weight:800}
.card .z{color:var(--soft);font-size:14px;margin:2px 0 12px}
.temps{display:flex;gap:18px;margin-bottom:10px}
.temps div{font:500 14px Archivo,sans-serif;color:var(--soft)}
.temps b{display:block;font:700 clamp(34px,5vw,44px)/1 "Archivo Narrow",sans-serif;color:var(--ink)}

.card p{margin:4px 0;font-size:15.5px}
.find{margin-top:14px}
.find label{font-size:14px;color:var(--soft);display:block;margin-bottom:4px}
.find input{width:100%;font:16px Archivo,sans-serif;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:14px;color:var(--soft)}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:16px;height:12px;border-radius:3px;display:inline-block}
.src{color:var(--soft);font-size:13px;margin-top:16px}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}.lbl{font-size:21px;stroke-width:5px}.lbl.x{display:none}}
@media(prefers-reduced-motion:reduce){.m{transition:none}}
</style>
</head>

const M=G.m,svg=document.getElementById('map');svg.setAttribute('viewBox',`0 0 600 ${G.h}`);

const BIG=['Ciudad Real','Puertollano','Tomelloso','Valdepeñas','Alcázar de San Juan','Almadén','Manzanares','Villanueva de los Infantes','Daimiel','Villarrubia de los Ojos'];

let K='tx',sel=M.find(m=>m.n==='Ciudad Real');

svg.innerHTML=M.map((m,i)=>`<path class="m" data-i="${i}" d="${m.d}"><title>${esc(m.n)}</title></path>`).join('')+
`<path class="prov" d="${G.o}"/>`+
M.filter(m=>BIG.includes(m.n)).map(m=>`<text class="lbl${['Daimiel','Villarrubia de los Ojos','Manzanares'].includes(m.n)?' x':''}" data-b="${M.indexOf(m)}" x="${m.c[0]}" y="${m.c[1]}" text-anchor="middle"></text>`).join('');

const wind=w=>w==='Calma'?'en calma':esc(w)+' km/h';
const draw=()=>{P.forEach((p,i)=>p.style.fill=fill(M[i]));

leg.innerHTML=K==='c1'?SKYO.map(s=>`<span><i style="background:${SKY[s]}"></i>${s}</span>`).join(''):

document.getElementById('card').innerHTML=`<h2>${esc(m.n)}</h2><div class="z">${esc(m.z)}</div>
<div class="temps"><div class="mn"><b>${f(m.tn)}°</b>mínima</div><div class="mx"><b>${f(m.tx)}°</b>máxima</div></div>
<p>Mañana: ${esc(m.c1.toLowerCase())}, viento ${wind(m.w1)}</p><p>Tarde: ${esc(m.c2.toLowerCase())}, viento ${wind(m.w2)}</p><p>Probabilidad de lluvia: 0%</p>`};
P.forEach((p,i)=>{p.addEventListener('click',()=>show(M[i]));p.addEventListener('mouseenter',()=>{if(matchMedia('(hover:hover)').matches)show(M[i])})});
document.querySelectorAll('.ctrl button').forEach(b=>b.addEventListener('click',()=>{K=b.dataset.k;document.querySelectorAll('.ctrl button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}));
const dl=document.getElementById('ml');[...M].sort((a,b)=>a.n.localeCompare(b.n,'es')).forEach(m=>{const o=document.createElement('option');o.value=m.n;dl.appendChild(o)});
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase();const m=M.find(x=>x.n.toLowerCase()===v);if(m)show(m)});
